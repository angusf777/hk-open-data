limit_req_zone $binary_remote_addr zone=public_api:10m rate=10r/s;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location /v1/ {
    limit_req zone=public_api burst=30 nodelay;
    proxy_pass http://api:3000/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-ID $request_id;
  }
  location / { try_files $uri $uri/ /index.html; }
}
