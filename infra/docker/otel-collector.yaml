receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
processors:
  attributes/redact:
    actions:
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }
      - { key: http.response.header.set-cookie, action: delete }
      - { key: db.connection_string, action: delete }
      - { key: enduser.id, action: hash }
  batch: {}
exporters:
  debug: { verbosity: basic }
service:
  pipelines:
    traces: { receivers: [otlp], processors: [attributes/redact, batch], exporters: [debug] }
    metrics: { receivers: [otlp], processors: [attributes/redact, batch], exporters: [debug] }
    logs: { receivers: [otlp], processors: [attributes/redact, batch], exporters: [debug] }
