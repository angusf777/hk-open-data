[project]
name = "hk-data-worker"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40,<2",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hk_data_worker"]
