[project]
name = "hk-open-data"
version = "0.1.0"
description = "Validation and self-hosted tooling for the HK Open Data catalogue."
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40,<2",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pyyaml>=6.0,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
  "types-pyyaml>=6.0,<7",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/sdk-python", "services/worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "services/worker", "packages/sdk-python/src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
allowed-confusables = ["，", "；"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "services/worker"
