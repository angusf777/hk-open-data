schemaVersion: 1
sourceReference: HKAPI-001
recipeVersion: 1.0.0
adapter: ckan-action
status: fixture-tested
documentationUrl: https://data.gov.hk/en/help/ckan-api-development-guide
limitations:
  - Metadata response only; dataset-specific terms still apply.
authentication:
  type: none
  environmentVariables: []
  setup: null
request:
  method: GET
  urlTemplate: https://data.gov.hk/en-data/api/3/action/package_list
  allowedHosts:
    - data.gov.hk
  parameters:
    - name: limit
      location: query
      dataType: integer
      required: false
      default: 10
      example: 10
      description: Maximum metadata records returned by this example.
      enum: []
    - name: offset
      location: query
      dataType: integer
      required: false
      default: 0
      example: 0
      description: Metadata record offset.
      enum: []
  headers:
    - name: accept
      value: application/json
      environmentVariable: null
  bodyTemplate: null
  timeoutMs: 15000
  maxResponseBytes: 1048576
  maxPages: 1
  retry:
    attempts: 2
    statusCodes:
      - 408
      - 429
      - 500
      - 502
      - 503
      - 504
response:
  mediaTypes:
    - application/json
  recordPath: /result
  idPath: null
  timestampPath: null
  pagination:
    strategy: none
    nextPath: null
  normalization:
    fields: {}
    language: null
    geometry: null
    timestamp: null
reason: null
nextAction: null
