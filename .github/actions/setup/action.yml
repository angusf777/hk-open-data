name: Set up HK Open Data toolchain
description: Install pinned Node, pnpm, Python, uv, workspace dependencies, and optional Chromium.
inputs:
  install-browser:
    description: Install Chromium and operating-system dependencies for Playwright.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
      with:
        version: "10.0.0"
        run_install: false
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
      with:
        node-version: "22"
        cache: pnpm
    - name: Set up uv and Python
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      with:
        version: "0.11.16"
        python-version: "3.12"
        enable-cache: true
    - name: Install dependencies
      shell: bash
      run: |
        pnpm install --frozen-lockfile
        uv sync --frozen --all-groups
    - name: Install Chromium
      if: inputs.install-browser == 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
