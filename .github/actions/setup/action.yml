name: Set up HK Open Data toolchain
description: Install pinned Node, pnpm, Python, uv, workspace dependencies, and optional Chromium.
inputs:
  install-browser:
    description: Install Chromium and operating-system dependencies for Playwright.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      with:
        version: "10.0.0"
        run_install: false
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: "22"
        cache: pnpm
    - name: Set up uv and Python
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      with:
        version: "0.11.16"
        python-version: "3.12"
        enable-cache: true
    - name: Install dependencies
      shell: bash
      run: |
        pnpm install --frozen-lockfile
        uv sync --frozen --all-groups
    - name: Install Chromium
      if: inputs.install-browser == 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
