name: Catalogue health

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup
      - run: uv run python scripts/check_catalogue_links.py
      - run: node scripts/render_health_issue.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: catalogue-link-health
          path: |
            catalog/generated/link-health.json
            catalog/generated/link-health.md
          if-no-files-found: error
          retention-days: 30

  provider-resources:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup
      - name: Refresh metadata and run bounded representative probes
        shell: bash
        run: |
          set -euo pipefail
          cp access/generated/data-gov-resources.json "${RUNNER_TEMP}/baseline-data-gov-resources.json"
          uv run python -m scripts.data_gov_resources refresh --concurrency 3
          set +e
          uv run python -m scripts.data_gov_resources probe \
            --concurrency 3 --max-candidates 3 --sample-bytes 4096
          probe_status="$?"
          set -e
          if [[ "$probe_status" -gt 1 ]]; then
            exit "$probe_status"
          fi
          uv run python -m scripts.data_gov_resource_changes \
            "${RUNNER_TEMP}/baseline-data-gov-resources.json" \
            access/generated/data-gov-resources.json \
            access/verification/data-gov-resources/manifest.json \
            --json-output catalog/generated/provider-resource-health.json \
            --markdown-output catalog/generated/provider-resource-health.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: provider-resource-health
          path: |
            catalog/generated/provider-resource-health.json
            catalog/generated/provider-resource-health.md
            access/generated/data-gov-resources.json
            access/verification/data-gov-resources/manifest.json
          if-no-files-found: error
          retention-days: 30

  issue:
    needs: [check, provider-resources]
    if: github.repository == 'angusf777/hk-open-data'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: catalogue-link-health
          path: catalog/generated
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: provider-resource-health
          path: provider-resource-health
      - name: Create, update, or close the single health issue
        shell: bash
        run: |
          set -euo pipefail
          title="Automated catalogue health report"
          number="$(gh issue list --state all --search 'Automated catalogue health report in:title' --json number --jq '.[0].number // empty')"
          failures="$(jq -r '.summary.failures' catalog/generated/link-health.json)"
          if [[ -z "$number" ]]; then
            if [[ "$failures" != "0" ]]; then
              gh issue create --title "$title" --label stale-source --body-file catalog/generated/link-health.md
            fi
          elif [[ "$failures" == "0" ]]; then
            gh issue edit "$number" --body-file catalog/generated/link-health.md
            gh issue close "$number" --comment "The latest bounded check has no current findings."
          else
            gh issue reopen "$number" >/dev/null 2>&1 || true
            gh issue edit "$number" --body-file catalog/generated/link-health.md --add-label stale-source
          fi

          resource_title="Automated provider-resource report"
          resource_number="$(gh issue list --state all --search 'Automated provider-resource report in:title' --json number --jq '.[0].number // empty')"
          resource_report="provider-resource-health/catalog/generated/provider-resource-health.json"
          resource_body="provider-resource-health/catalog/generated/provider-resource-health.md"
          resource_findings="$(jq '[.summary.resources[], .summary.datasets[]] | add' "$resource_report")"
          probe_failures="$(jq -r '.summary.probeFailures' "$resource_report")"
          if [[ -z "$resource_number" ]]; then
            if [[ "$resource_findings" != "0" || "$probe_failures" != "0" ]]; then
              gh issue create --title "$resource_title" --label stale-source --body-file "$resource_body"
            fi
          elif [[ "$resource_findings" == "0" && "$probe_failures" == "0" ]]; then
            gh issue edit "$resource_number" --body-file "$resource_body"
            gh issue close "$resource_number" --comment "The latest refresh found no metadata changes or failed bounded probes."
          else
            gh issue reopen "$resource_number" >/dev/null 2>&1 || true
            gh issue edit "$resource_number" --body-file "$resource_body" --add-label stale-source
          fi
