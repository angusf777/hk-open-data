name: Catalogue health

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup
      - run: uv run python scripts/check_catalogue_links.py
      - run: node scripts/render_health_issue.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: catalogue-link-health
          path: |
            catalog/generated/link-health.json
            catalog/generated/link-health.md
          if-no-files-found: error
          retention-days: 30

  issue:
    needs: check
    if: github.repository == 'angusf777/hk-open-data'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: catalogue-link-health
          path: catalog/generated
      - name: Create, update, or close the single health issue
        shell: bash
        run: |
          set -euo pipefail
          title="Automated catalogue health report"
          number="$(gh issue list --state all --search 'Automated catalogue health report in:title' --json number --jq '.[0].number // empty')"
          failures="$(jq -r '.summary.failures' catalog/generated/link-health.json)"
          if [[ -z "$number" ]]; then
            if [[ "$failures" != "0" ]]; then
              gh issue create --title "$title" --label stale-source --body-file catalog/generated/link-health.md
            fi
          elif [[ "$failures" == "0" ]]; then
            gh issue edit "$number" --body-file catalog/generated/link-health.md
            gh issue close "$number" --comment "The latest bounded check has no current findings."
          else
            gh issue reopen "$number" >/dev/null 2>&1 || true
            gh issue edit "$number" --body-file catalog/generated/link-health.md --add-label stale-source
          fi
