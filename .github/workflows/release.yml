name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version without a v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install-browser: "true"
      - run: make verify-all
      - run: make verify-integrated

  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup
      - run: sh scripts/package-release.sh "${{ inputs.version }}"
      - run: shasum -a 256 -c artifacts/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-v${{ inputs.version }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-v${{ inputs.version }}
          path: artifacts
      - name: Create immutable tag and release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          test -f "docs/release/v${version}.md"
          test -z "$(git tag --list "v${version}")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${version}" -m "HK Open Data v${version}"
          git push origin "v${version}"
          gh release create "v${version}" artifacts/* \
            --title "HK Open Data v${version}" \
            --notes-file "docs/release/v${version}.md" \
            --verify-tag
