version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Hong_Kong
    groups:
      compatible-updates:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Hong_Kong
    groups:
      compatible-updates:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Hong_Kong
    groups:
      compatible-updates:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Hong_Kong
    groups:
      compatible-updates:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
