schemaVersion: 1
sourceReference: HKAPI-021
recipeVersion: 1.0.0
adapter: rest-json
status: fixture-tested
documentationUrl: https://www.als.gov.hk/docs/Data_Dictionary_for_ALS_EN.pdf
limitations:
- Technical access example only; review current provider terms, attribution, caching
  and redistribution requirements before use.
- The bounded example is not a promise of availability, completeness or fitness for
  a particular purpose.
authentication:
  type: none
  environmentVariables: []
  setup: null
request:
  method: GET
  urlTemplate: https://www.als.gov.hk/lookup
  allowedHosts:
  - www.als.gov.hk
  parameters:
  - name: q
    location: query
    dataType: string
    required: true
    default: 10 Queensway
    example: 10 Queensway
    description: Address text, up to 255 characters.
    enum: []
  - name: n
    location: query
    dataType: integer
    required: true
    default: 10
    example: 10
    description: Maximum suggested addresses.
    enum: []
  headers:
  - name: accept
    value: application/json
    environmentVariable: null
  - name: accept-language
    value: en, zh-Hant
    environmentVariable: null
  bodyTemplate: null
  timeoutMs: 15000
  maxResponseBytes: 1048576
  maxPages: 1
  retry:
    attempts: 2
    statusCodes:
    - 408
    - 429
    - 500
    - 502
    - 503
    - 504
response:
  mediaTypes:
  - application/json
  recordPath: /SuggestedAddress
  idPath: /Address/PremisesAddress/GeoAddress
  timestampPath: null
  pagination:
    strategy: none
    nextPath: null
  normalization:
    fields: {}
    language: null
    geometry: null
    timestamp: null
reason: null
nextAction: null
