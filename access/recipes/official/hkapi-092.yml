schemaVersion: 1
sourceReference: HKAPI-092
recipeVersion: 1.0.0
adapter: rest-json
status: fixture-tested
documentationUrl: https://data.weather.gov.hk/weatherAPI/doc/HKO_Open_Data_API_Documentation.pdf
limitations:
- Technical access example only; review current provider terms, attribution, caching and redistribution
  requirements before use.
- The bounded example is not a promise of availability, completeness or fitness for a particular purpose.
authentication:
  type: none
  environmentVariables: []
  setup: null
request:
  method: GET
  urlTemplate: https://data.weather.gov.hk/weatherAPI/opendata/earthquake.php
  allowedHosts:
  - data.weather.gov.hk
  parameters:
  - name: dataType
    location: query
    dataType: string
    required: true
    default: qem
    example: qem
    description: HKO earthquake dataset type.
    enum:
    - qem
    - feltearthquake
    minimum: null
    maximum: null
    pattern: null
  - name: lang
    location: query
    dataType: string
    required: true
    default: en
    example: en
    description: Response language.
    enum:
    - en
    - tc
    - sc
    minimum: null
    maximum: null
    pattern: null
  headers:
  - name: accept
    value: application/json
    environmentVariable: null
  bodyTemplate: null
  timeoutMs: 15000
  maxResponseBytes: 1048576
  maxPages: 1
  retry:
    attempts: 2
    statusCodes:
    - 408
    - 429
    - 500
    - 502
    - 503
    - 504
response:
  mediaTypes:
  - application/json
  recordPath: ''
  idPath: null
  timestampPath: null
  pagination:
    strategy: none
    nextPath: null
  normalization:
    fields: {}
    language: null
    geometry: null
    timestamp: null
reason: null
nextAction: null
