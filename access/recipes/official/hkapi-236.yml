schemaVersion: 1
sourceReference: HKAPI-236
recipeVersion: 1.0.0
adapter: rest-json
status: live-verified
documentationUrl: https://data.gov.hk/en/help/api-spec
limitations:
- Technical access example only; review current provider terms, attribution, caching and redistribution
  requirements before use.
